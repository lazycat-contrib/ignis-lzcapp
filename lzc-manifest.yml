application:
  subdomain: ignis
  upstreams:
    - location: /
      backend: http://ignis:{{ .U.port }}/
  injects:
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  ignis:
    # upstream: nobbe/ignis:latest
    image: docker.1ms.run/nobbe/ignis@sha256:f47400d33d87f27d50c5c057aa2dc951c9208e3feb5cf81890152be26bad13db
    environment:
      - PUID={{ .U.puid }}
      - PGID={{ .U.pgid }}
      - PORT={{ .U.port }}
      - VAULT_ROOT=/vaults
      - DATA_ROOT=/app/data
      - OBSIDIAN_VERSION={{ .U.obsidian_version }}
      - OBSIDIAN_ASSETS_PATH=/app/obsidian-app
    binds:
      - /lzcapp/var/vaults:/vaults
      - /lzcapp/var/data:/app/data
      - /lzcapp/cache/obsidian-app:/app/obsidian-app
usage: |
  首次启动会下载并解包 Obsidian，需要能够访问 GitHub 和 npm。
  应用通过懒猫身份认证保护访问；已授权访问本应用的用户共享同一套笔记库。
  笔记库保存在 /lzcapp/var/vaults，运行配置保存在 /lzcapp/var/data。
  Obsidian 下载缓存位于 /lzcapp/cache/obsidian-app，清理后会在启动时重新下载。
